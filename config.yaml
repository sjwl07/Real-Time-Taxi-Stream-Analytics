run_id: "DEFAULT"
results_dir: "results"

kafka:
  bootstrap_servers: "localhost:9092"
  topics:                       # fixed names required by the assignment
    raw: "taxi.raw"
    clean: "taxi.clean"
    metrics: "taxi.metrics"
    lsh: "taxi.lsh"

data:
  source_file: "data/yellow_tripdata_2026-01.parquet"   # <- keep YOUR path (.parquet or .csv)
  event_id_prefix: "2026-01"
  start_date: "2026-01-01"      # keep trips picked up in [start, end)
  end_date: "2026-02-01"
  max_events: 60000             # size of the replayed taxi segment

# ---------------- parameters from the assignment (Section 3) ----------------
partitions: 4                   # taxi.raw and taxi.clean
producer_rate: 600              # events/second (this laptop sustains ~505/s)
duplicate_rate: 0.02
delayed_event_rate: 0.02
max_delay_seconds: 20
window_minutes: 60
hll_precision: 12
dgim_max_window: 10000
bloom_expected_items: 200000
bloom_false_positive_target: 0.01
lsh_num_hashes: 100
lsh_bands: 20                   # default LSH setting (Stage 3 uses these two)
lsh_rows_per_band: 5
jaccard_threshold: 0.50

# ---------------- our additional settings ----------------
key_mode: "pickup_zone"         # pickup_zone (K1) | round_robin (K2)
allowed_lateness_min: 360       # watermark delay in EVENT-time minutes (Stage 2 and 3)

spark:
  local_slots: 4                # processing slots = Spark local[N] for Stage 1 and 2

stage1:
  checkpoint_dir: "checkpoints/stage1"
  state_buckets: 8              # Bloom filter shards (Spark state); keep fixed
  max_offsets_per_trigger: 5000
  trigger_seconds: 1
  max_duration_min: 360         # validation limits
  max_distance_miles: 200

stage2:
  checkpoint_dir: "checkpoints/stage2"
  state_file: "checkpoints/stage2_state.pkl"
  max_offsets_per_trigger: 5000
  trigger_seconds: 1
  reservoir_sizes: [100, 1000, 10000]
  sample_budget_events: 1000    # per-window storage budget, event AND entity sampling
  diverse_min_destinations: 10
  dgim_queries: [1000, 5000, 10000]
  seed: 42

stage3:
  checkpoint_dir: "checkpoints/stage3"
  state_file: "checkpoints/stage3_state.pkl"
  max_offsets_per_trigger: 5000
  trigger_seconds: 1
  min_trips: 20
  minhash_seed: 1
  extra_lsh_configs: [[25, 4], [10, 10]]   # [bands, rows], evaluated besides lsh_bands x lsh_rows_per_band